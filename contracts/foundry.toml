[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
gas_reports = ["Enrollment", "HeartbeatRegistry"]
fs_permissions = [{access = "read", path = "../protocol-params.json"}]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
